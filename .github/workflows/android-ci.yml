name: NEXO Android CI Check

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public-available-release/**"
      - "**.md"
  workflow_dispatch:

jobs:
  verify-build:
    name: Verify Android Compilation & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & Licenses
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER_BIN=$(find "$SDK_DIR" -name "sdkmanager" -type f 2>/dev/null | head -n1 || true)
          if [ -n "$SDKMANAGER_BIN" ]; then
            set +o pipefail
            yes | "$SDKMANAGER_BIN" --licenses >/dev/null 2>&1 || true
            set -o pipefail
          else
            mkdir -p "$SDK_DIR/licenses"
            printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK_DIR/licenses/android-sdk-license"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for CI test build
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit Tests & Compile Check
        run: gradle :app:testDebugUnitTest :app:compileReleaseKotlin --no-daemon --stacktrace
